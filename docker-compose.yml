services:
  db:
    image: postgres:16
    container_name: yottaflex-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yottaflex}
      POSTGRES_USER: ${POSTGRES_USER:-yottaflex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: